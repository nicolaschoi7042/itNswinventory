services:
  # PostgreSQL 데이터베이스
  database:
    image: postgres:15-alpine
    container_name: it-postgres-prod
    ports:
      - "5435:5432"
    environment:
      - POSTGRES_DB=inventory_db
      - POSTGRES_USER=inventory_user
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - TZ=Asia/Seoul
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database.sql:/docker-entrypoint-initdb.d/init.sql
      - ./backend/backup:/backup
    networks:
      - it-inventory-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory_user -d inventory_db"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 백엔드 API 서버
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: it-backend-prod
    environment:
      - NODE_ENV=production
      - DB_HOST=database
      - DB_NAME=inventory_db
      - DB_USER=inventory_user
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - PORT=3000
      - TZ=Asia/Seoul
      # LDAP 설정 (backend/.env 파일에서 로드)
      - LDAP_ENABLED=${LDAP_ENABLED:-true}
      - LDAP_SERVER=${LDAP_SERVER:-ldap://172.30.1.97:389}
      - LDAP_BIND_DN=${LDAP_BIND_DN}
      - LDAP_BIND_PASSWORD=${LDAP_BIND_PASSWORD}
      - LDAP_USER_BASE=${LDAP_USER_BASE}
      - LDAP_GROUP_BASE=${LDAP_GROUP_BASE}
      - LDAP_USER_FILTER=${LDAP_USER_FILTER}
      - LDAP_GROUP_FILTER=${LDAP_GROUP_FILTER}
      - LDAP_USER_FULLNAME_ATTR=${LDAP_USER_FULLNAME_ATTR}
      - LDAP_USER_EMAIL_ATTR=${LDAP_USER_EMAIL_ATTR}
      - ONESEARCH_JWT_SECRET=${ONESEARCH_JWT_SECRET:-}
      - GOOGLE_OAUTH_ENABLED=${GOOGLE_OAUTH_ENABLED:-false}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_ALLOWED_DOMAIN=${GOOGLE_ALLOWED_DOMAIN:-}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN:-}
      - SLACK_NOTIFY_CHANNEL=${SLACK_NOTIFY_CHANNEL:-D088R2K789F}
      - ANTHROPIC_ADMIN_KEY=${ANTHROPIC_ADMIN_KEY:-}
    volumes:
      - ./backend/backup:/backup
      - api_logs:/app/logs
    networks:
      - it-inventory-network
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 프론트엔드 웹서버
  frontend:
    build: .
    container_name: it-frontend-prod
    ports:
      - "8082:80"
    environment:
      - TZ=Asia/Seoul
      - API_BASE_URL=http://backend:3000/api
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/nginx.conf:ro
      - ./logs:/var/log/nginx
    networks:
      - it-inventory-network
    depends_on:
      - backend
    restart: unless-stopped

  # 백업 스케줄러 (Cron)
  backup-scheduler:
    image: alpine:latest
    container_name: it-backup-scheduler-prod
    environment:
      - TZ=Asia/Seoul
      - DB_PASSWORD=${DB_PASSWORD}
      - CONTAINER_NAME=it-postgres-prod
    volumes:
      - ./backend/backup:/backup
      - ./scripts:/scripts
      - ./backups:/backups
      - postgres_data:/data
      - backup_data:/data/backups
    networks:
      - it-inventory-network
    depends_on:
      - database
    restart: unless-stopped
    command: |
      sh -c "
        apk add --no-cache postgresql-client dcron bash curl bc &&
        chmod +x /scripts/*.sh &&
        mkdir -p /backups &&
        echo '0 2 * * * /scripts/backup-db.sh /backups >> /var/log/backup.log 2>&1' > /etc/crontabs/root &&
        echo '0 14 * * * /scripts/backup-db.sh /backups >> /var/log/backup.log 2>&1' >> /etc/crontabs/root &&
        echo '백업 스케줄러 시작: 매일 오전 2시, 오후 2시 자동 백업' &&
        crond -f -d 8
      "

  # 모니터링 (Prometheus + Grafana)
  prometheus:
    image: prom/prometheus:latest
    container_name: it-inventory-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - it-inventory-network
    restart: unless-stopped
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: it-inventory-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - it-inventory-network
    restart: unless-stopped
    profiles:
      - monitoring

networks:
  it-inventory-network:
    driver: bridge

volumes:
  postgres_data:
  backup_data:
  api_logs:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
